<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Gallery</title>
  <link rel="stylesheet" href="/src/gallery/gallery.css">
</head>
<body>
  <!-- Entry overlay -->
  <div id="entry-overlay">
    <div id="entry-content">
      <h1 id="gallery-name">Loading...</h1>
      <p id="entry-prompt">Press Enter or Tap to Enter</p>
    </div>
  </div>

  <!-- Three.js canvas container -->
  <div id="canvas-container"></div>

  <!-- HUD overlay -->
  <div id="hud">
    <div id="fps-counter">-- FPS</div>
    <canvas id="minimap-canvas"></canvas>
  </div>

  <!-- Artwork detail overlay -->
  <div id="detail-overlay" class="hidden">
    <div id="detail-panel">
      <button id="detail-close">&times;</button>
      <img id="detail-image" alt="Artwork">
      <h2 id="detail-title"></h2>
      <p id="detail-meta"></p>
      <p id="detail-description"></p>
    </div>
  </div>

  <!-- Crosshair (desktop only) -->
  <div id="crosshair"></div>

  <!-- Interaction prompt -->
  <div id="interaction-prompt">Click to view</div>

  <!-- Loading overlay -->
  <div id="loading-overlay" style="display:none">
    <div class="loading-spinner"></div>
    <p>Loading gallery...</p>
  </div>

  <!-- Audio controls -->
  <div id="audio-controls">
    <button id="mute-btn">&#x1F50A;</button>
    <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.3">
  </div>

  <script type="module" src="/src/gallery/main.js"></script>
</body>
</html>
